name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests + coverage
        run: PYTHONPATH=src pytest --cov=src --cov-report=term-missing -q
      - name: Lint
        run: ruff check src tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      - name: Audit dev dependencies (informational)
        run: pip-audit -r requirements-dev.txt || true

  sam-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aws-sam-cli==1.171.0
      - name: Validate SAM template
        run: sam validate --lint
